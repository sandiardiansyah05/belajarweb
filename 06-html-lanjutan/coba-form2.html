<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Input Atribut, Checbox & Radio</title>
  </head>
  <body>
    <h1>Contoh Input Atribut, Checbox & Radio</h1>
    <form>
      <input
        type="text"
        name="Nama"
        placeholder="Masukkan Nama lengkapmu"
        autocomplete="off"
      />
      <br />
      <label for="cita-cita1">
        <input type="checkbox" name="cita-cita1" value="Pilot" /> Pilot
      </label>
      <br />
      <label for="cita-cita2">
        <input type="checkbox" name="cita-cita2" value="Programmer" />
        Programmer
      </label>
      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
