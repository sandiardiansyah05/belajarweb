<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coba element form</title>
  </head>
  <body>
    <h1>contoh element-element form pada html</h1>

    <form>
      <label for="text"
        >Nama :
        <input
          type="text"
          name="Nama"
          id="text"
          placeholder="Masukkan Nama"
        /> </label
      ><br />

      <label for="password"
        >Password:
        <input type="password" id="password" name="password" />
      </label>
      <br />

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Masukkan Email"
      />
      <br />

      <label for="number"
        >Number
        <input
          type="number"
          id="number"
          name="angka"
          min="1"
          max="10"
        /> </label
      ><br />

      <label for="date">tanggal:</label>
      <input type="date" id="date" name="date" />
      <br />

      <label for="warna">Warna:</label>
      <input type="color" id="warna" name="warna" />

      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
