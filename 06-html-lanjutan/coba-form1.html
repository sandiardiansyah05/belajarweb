<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coba element form</title>
  </head>
  <body>
    <h1>contoh element-element form pada html</h1>

    <form>
      <label for="text"
        >Nama :
        <input
          type="text"
          name="Nama"
          id="text"
          placeholder="Masukkan Nama"
        /> </label
      ><br />

      <label for="password"
        >Password:
        <input type="password" id="password" name="password" />
      </label>
    </form>
  </body>
</html>
