<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba List</title>
  </head>
  <body>
    <h2>Ordered List / Daftar Terurut</h2>
    <ol type="A">
      <li>item 1</li>
      <li>item 2</li>
      <li>item 3</li>
      <li>item 4</li>
      <li>item 5</li>
    </ol>
    <!-- syntax diatas : ol>li{item $}*5 -->

    <h2>Unordered List / Daftar Tidak Terurut</h2>
    <ul type="square">
      <li>item 1</li>
      <li>item 2</li>
      <li>item 3</li>
      <li>item 4</li>
      <li>item 5</li>
    </ul>
    <!-- syntax diatas : ul>li{item $}*5 -->

    <h2>Description List</h2>
    <dl>
      <dt>HTML</dt>
      <dd>Hypertext Markup Language</dd>
      <dt>CSS</dt>
      <dd>Cascading Style Sheet</dd>
      <dt>JS</dt>
      <dd>JavaScript</dd>
    </dl>
  </body>
</html>
